name: update stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy run as two jobs: when deploy-pages starts right after the
  # upload in the same job, it sometimes finds no artifact yet ("Found 0 artifact(s)").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: collect
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 collect.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
